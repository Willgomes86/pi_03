{% extends "base.html" %}

{% block title %}Usuários | Colo de Mãe{% endblock %}

{% block content %}
  <section class="card-soft p-4 mb-4">
    <h1 class="h4 mb-1">Cadastro de Funcionário</h1>
    <p class="text-secondary mb-0">Crie acessos para a equipe que opera o sistema da ONG.</p>
  </section>

  <section class="row justify-content-center">
    <div class="col-lg-7">
      <form class="card-soft p-4" method="post" action="{% url 'cadastro_funcionario' %}">
        {% csrf_token %}

        <div class="row g-2">
          <div class="col-md-6 mb-3">
            <label class="form-label" for="InputFirstName">Primeiro nome</label>
            <input type="text" class="form-control" id="InputFirstName" name="firstname" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label" for="InputLastName">Sobrenome</label>
            <input type="text" class="form-control" id="InputLastName" name="lastname" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="InputUsername">Usuário</label>
          <input type="text" class="form-control" id="InputUsername" name="username" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="InputEmail">E-mail</label>
          <input type="email" class="form-control" id="InputEmail" name="email" required>
        </div>

        <div class="row g-2">
          <div class="col-md-6 mb-3">
            <label class="form-label" for="InputPassword">Senha</label>
            <input type="password" class="form-control" id="InputPassword" name="password" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label" for="InputConfirmPassword">Confirmar senha</label>
            <input type="password" class="form-control" id="InputConfirmPassword" name="confirm_password" required>
          </div>
        </div>

        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" name="is_admin" id="flexCheckAdmin">
          <label class="form-check-label" for="flexCheckAdmin">Administrador</label>
        </div>
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" name="is_staff" id="flexCheckStaff" checked>
          <label class="form-check-label" for="flexCheckStaff">Equipe (staff)</label>
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-brand flex-grow-1" type="submit">Cadastrar</button>
          <a class="btn btn-outline-secondary flex-grow-1" href="{% url 'home' %}">Cancelar</a>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
